{% extends 'base.html' %}

{% block title %}
  Logout
{% endblock %}

{% block content %}
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg border-0 p-5 text-center">
          <h2 class="text-danger mb-3">Logout</h2>

          <p class="text-muted">Are you sure you want to logout?</p>

          <form method="POST">
             {% csrf_token %}

            <button type="submit" class="btn btn-danger me-2">Yes, Logout</button>

            <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
