{% extends 'base.html' %}
{% load static %}

{% block content %}
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

  <style>
    body {
      background: linear-gradient(135deg, #0d6efd, #00c6ff);
    }
    
    .register-section {
      min-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 15px;
    }
    
    .register-card {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      color: white;
    }
    
    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 45px;
      color: #0d6efd;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    
    .input-group-text {
      background: white;
      border: none;
    }
    
    .form-control {
      border: none;
      height: 50px;
    }
    
    .form-control:focus {
      box-shadow: none;
    }
    
    .btn-register {
      height: 50px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 18px;
    }
    
    a {
      text-decoration: none;
    }
    
    .login-link {
      color: #fff;
      font-weight: bold;
    }
    
    .login-link:hover {
      color: #ffe082;
    }
  </style>

  <div class="register-section">
    <div class="register-card">
      <div class="text-center mb-4">
        <div class="logo">
          <i class="fas fa-user-plus"></i>
        </div>

        <h2 class="mt-3 fw-bold">Create Account</h2>

        <p>Create your ParcelPath account</p>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Username" required />
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="Email Address" required />
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>

          <input type="password" id="password" name="password" class="form-control" placeholder="Password" required />

          <button class="btn btn-light" type="button" onclick="togglePassword('password',this)"><i class="fas fa-eye"></i></button>
        </div>

        <div class="input-group mb-4">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>

          <input type="password" id="confirm" name="confirm" class="form-control" placeholder="Confirm Password" required />

          <button class="btn btn-light" type="button" onclick="togglePassword('confirm',this)"><i class="fas fa-eye"></i></button>
        </div>

        <button class="btn btn-warning w-100 btn-register">
          <i class="fas fa-user-plus"></i>
          Register
        </button>
      </form>

      <hr class="border-light" />

      <p class="text-center mb-0">
        Already have an account?

        <a href="{% url 'user_login' %}" class="login-link">Login</a>
      </p>
    </div>
  </div>
  <script>
    function togglePassword(id, btn) {
      let input = document.getElementById(id)
    
      let icon = btn.querySelector('i')
    
      if (input.type === 'password') {
        input.type = 'text'
    
        icon.classList.remove('fa-eye')
    
        icon.classList.add('fa-eye-slash')
      } else {
        input.type = 'password'
    
        icon.classList.remove('fa-eye-slash')
    
        icon.classList.add('fa-eye')
      }
    }
  </script>

{% endblock %}
